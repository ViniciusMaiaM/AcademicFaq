services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/analytics.db
    volumes:
      - chroma_db:/app/chroma_db
      - analytics_db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - chroma_db:/app/chroma_db
      - ./docs:/app/docs:ro
    working_dir: /app
    entrypoint: ["python", "scripts/ingest.py"]

volumes:
  chroma_db:
  analytics_db:
